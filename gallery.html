<!DOCTYPE html>
<html lang="en">
<!-- File: gallery.html 
Description: Contains functionality to display the gallary images as thumbnail. On click, the image is enlarged. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nalanda Chess Academy - Gallery</title>
    <!-- Use Tailwind CSS for a modern, responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        nav.fixed.bottom-0 ul li a.active span,
        nav.fixed.bottom-0 ul li a.active i {
            color: #8b5cf6; /* purple-400 */
        }
    </style>
</head>
<body class="bg-gray-100 antialiased flex flex-col min-h-screen">

    <!-- Placeholder for the dynamically loaded header -->
    <div id="header-placeholder"></div>

    <!-- Main Content Area -->
    <main class="p-4 md:p-8 flex-grow pb-20 md:pb-8">

        <!-- Gallery Section Title -->
        <section class="max-w-6xl mx-auto text-center py-8">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">GALLERY</h1>
            <h3 class="text-xl text-gray-600 font-semibold">Memorable Moments from Our Academy</h3>
        </section>

        <section id="gallery-container" class="max-w-6xl mx-auto my-8 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            </section>

    </main>

    <footer class="bg-gray-900 text-gray-300 p-4 text-center mt-auto rounded-t-lg shadow-inner">
        <p>&copy; 2025 Nalanda Chess Academy. All rights reserved.</p>
    </footer>

    <!-- Script to load the header dynamically and handle page logic -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const headerPlaceholder = document.getElementById('header-placeholder');
            if (headerPlaceholder) {
                try {
                    const response = await fetch('header.html');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const headerHtml = await response.text();
                    headerPlaceholder.innerHTML = headerHtml;

                    // After header is loaded, initialize its UI elements
                    if (window.initializeHeaderUI) {
                        window.initializeHeaderUI();
                    }
                } catch (error) {
                    console.error('Error loading header:', error);
                }
            }
        });
    </script>
    
    <script src="gallery.js" type="module"></script>

</body>
</html>
