<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nalanda Chess Academy - Contact Us</title>
    <!-- Use Tailwind CSS for a modern, responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom styles for the active nav link */
        nav.fixed.bottom-0 ul li a.active span,
        nav.fixed.bottom-0 ul li a.active i {
            color: #8b5cf6;
        }

        /* Basic form styling to make it look decent with Tailwind */
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        form input, form textarea, form button {
            padding: 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        form input:focus, form textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.5);
        }
        form textarea {
            min-height: 100px;
            resize: vertical;
        }
        form button {
            background-color: #8b5cf6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        form button:hover {
            background-color: #7c3aed;
        }
        #formStatus {
            text-align: center;
            margin-top: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 antialiased flex flex-col min-h-screen">

    <!-- Placeholder for the dynamically loaded header -->
    <div id="header-placeholder"></div>

    <main class="p-2 md:p-4 flex-grow pb-10 md:pb-4">        
        <section class="max-w-6xl mx-auto py-8">
            <h1 class="text-4xl font-extrabold text-gray-800 text-center mb-4">CONTACT US</h1>
            <p class="text-lg text-gray-600 text-center mb-8">Have a question or want to join us? Send us a message!</p>

			<!-- Corrected alignment to display contact info in a column with reduced gap -->
            <div class="flex flex-col justify-center items-center gap-2 mb-8 text-center">
                <a href="mailto:nalandachessacademysmga@gmail.com" class="flex items-center text-gray-700 hover:text-purple-600 transition-colors">
                    <i class="fas fa-envelope mr-2 text-xl"></i>
                    <span class="text-lg">nalandachessacademysmga@gmail.com</span>
                </a>
                <a href="mailto:srikrishnaudupa8@gmail.com" class="flex items-center text-gray-700 hover:text-purple-600 transition-colors">
                    <i class="fas fa-envelope mr-2 text-xl"></i>
                    <span class="text-lg">srikrishnaudupa8@gmail.com</span>
                </a>
                <a href="tel:+919844436276" class="flex items-center text-gray-700 hover:text-purple-600 transition-colors">
                    <i class="fas fa-phone-alt mr-2 text-xl"></i>
                    <span class="text-lg">+91 98444 36276</span>
                </a>
            </div>		
            

            <form id="contactForm">
                <input type="text" name="name" required placeholder="Your Name">
                <input type="email" name="email" required placeholder="Your Email">
                <input type="tel" name="phone" placeholder="Phone (optional)">
                <textarea name="message" required placeholder="Your message"></textarea>
                <button type="submit">Send</button>
            </form>
            <div id="formStatus"></div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer class="bg-gray-900 text-gray-300 p-4 text-center mt-auto rounded-t-lg shadow-inner">
        <p>&copy; 2025 Nalanda Chess Academy. All rights reserved.</p>
    </footer>

    <!-- Script to load the header dynamically -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const headerPlaceholder = document.getElementById('header-placeholder');
            if (headerPlaceholder) {
                try {
                    const response = await fetch('header.html');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const headerHtml = await response.text();
                    headerPlaceholder.innerHTML = headerHtml;
                    // After header is loaded, initialize its UI elements and listeners
                    if (window.initializeHeaderUI) {
                        window.initializeHeaderUI();
                    }
                } catch (error) {
                    console.error('Error loading header:', error);
                }
            }
        });
    </script>

    <!-- Service Worker Registration -->
    <script>
        const form = document.getElementById('contactForm');
        const status = document.getElementById('formStatus');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = new FormData(form);
            const body = Object.fromEntries(data.entries());

            status.textContent = 'Sending…';
            status.style.color = '#888';

            try {
                // Replace <project-id> with your actual Firebase project ID
                const res = await fetch('/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(errorText);
                }

                status.textContent = '✅ Message sent! We’ll get back to you soon.';
                status.style.color = 'green';
                form.reset();
            } catch (err) {
                console.error(err);
                status.textContent = `❌ ${err.message || 'Failed to send'}`;
                status.style.color = 'red';
            }
        });
    </script>
</body>
</html>
