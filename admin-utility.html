<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCA Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .menu-item.active { background-color: #e5e7eb; color: #8b5cf6; }
    </style>
</head>
<body class="bg-gray-100 antialiased min-h-screen flex flex-col">

    <div id="app-container" class="flex-1 flex flex-col hidden">
        
        <header class="bg-white p-4 flex justify-between items-center shadow-md">
			<div class="flex-1"></div>

			<div class="flex-1 text-center">
				<h1 class="text-xl font-bold text-purple-600">Admin Dashboard</h1>
			</div>

			<div class="relative flex-1 flex justify-end">
				<button id="user-icon-btn" class="flex items-center space-x-2 text-gray-700 hover:text-purple-600 focus:outline-none">
					<span id="user-display-name" class="font-semibold text-sm hidden md:inline"></span>
					<i class="fas fa-user-circle text-2xl"></i>
				</button>
				<div id="user-dropdown-menu" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 hidden z-10">
					<button id="logout-button" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
						<i class="fas fa-sign-out-alt mr-2"></i>Sign Out
					</button>
				</div>
			</div>
		</header>

        <div class="flex flex-1">
            <aside id="sidebar-menu" class="bg-white text-gray-800 w-64 p-4 shadow-lg hidden md:block">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-purple-600">Admin Panel</h2>
                </div>
                <nav>
                    <ul id="admin-menu" class="space-y-2">
                        </ul>
                </nav>
            </aside>
            
            <main class="p-4 md:p-8 flex-1 overflow-y-auto">
                <div id="dashboard-content" class="max-w-6xl mx-auto"></div>
            </main>
        </div>
    </div>
    
    <section id="auth-section" class="max-w-md mx-auto my-16 p-8 bg-white rounded-lg shadow-xl border border-gray-200">
        <h3 id="auth-status" class="text-2xl text-gray-800 font-semibold mb-6 text-center">Admin Sign-In</h3>
        <form id="auth-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500 sm:text-sm" placeholder="admin@nalanda.com" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500 sm:text-sm" required>
            </div>
            <div id="auth-error" class="text-red-500 text-sm hidden"></div>
            <button type="submit" id="auth-button" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition-colors">Sign In</button>
        </form>
    </section>

    <div id="custom-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full text-center">
            <p id="modal-text" class="text-gray-800 text-lg mb-4"></p>
            <div id="modal-actions" class="flex justify-around">
                <button id="modal-confirm-btn" class="hidden bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                    Confirm
                </button>
                <button id="modal-cancel-btn" class="hidden bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition-colors">
                    Cancel
                </button>
                <button id="modal-ok-btn" class="hidden bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                    OK
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-gray-900 text-gray-300 p-4 text-center mt-auto rounded-t-lg shadow-inner">
        <p>&copy; 2025 Nalanda Chess Academy. All rights reserved.</p>
    </footer>

    <script type="module" src="admin-main.js"></script>
</body>
</html>
