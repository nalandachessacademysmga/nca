<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Nalandha Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .modal {
            background-color: rgba(0, 0, 0, 0.9);
            transition: opacity 0.3s ease-in-out;
        }
    </style>
	<!-- Google Analytics Script -->
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z301KFQ12C"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());
	  gtag('config', 'G-Z301KFQ12C');
	</script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- This is the placeholder where the header will be dynamically loaded -->
    <div id="header-placeholder"></div>

    <div class="container mx-auto py-8">
        <h1 class="text-4xl font-extrabold text-center text-gray-800 mb-8">Events</h1>
        
        <!-- Events Container -->
        <div id="events-container" class="space-y-6">
            <!-- Event cards will be dynamically inserted here -->
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="image-modal" class="modal fixed inset-0 flex items-center justify-center p-4 z-50 hidden opacity-0">
        <div class="relative w-full h-full max-w-4xl max-h-4xl">
            <button id="close-modal-btn" class="absolute top-4 right-4 text-white text-3xl z-10">&times;</button>
            <button id="prev-image-btn" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white text-4xl p-2 rounded-full hover:bg-gray-700 hover:bg-opacity-50 transition-colors duration-200 z-10">&lt;</button>
            <button id="next-image-btn" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white text-4xl p-2 rounded-full hover:bg-gray-700 hover:bg-opacity-50 transition-colors duration-200 z-10">&gt;</button>
            <img id="modal-image" src="" alt="Full size image" class="w-full h-full object-contain">
        </div>
    </div>

    <!-- Script file for logic -->
    <script type="module" src="events-logic.js"></script>

    <!-- Script to dynamically load the header -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('header.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(html => {
                    document.getElementById('header-placeholder').innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading the header:', error);
                });
        });
    </script>
</body>
</html>
