<!-- The HTML file provides a simple container and a title for Conf Call -->
<!-- This file dynamically loads the Jitsi Meet external API and initializes the conference call. -->
<!DOCTYPE html>
<html>
<head>
    <style>
        html, body, #jaas-container { height: 100%; }
        .conference-container {
            width: 100%;
            height: 80vh; /* Adjust as needed */
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #jaas-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- We load the Jitsi API here to ensure it's available when we need it -->
    <script src='https://8x8.vc/vpaas-magic-cookie-9ba8c5498bf5496c95f1005fd25f4d51/external_api.js' async></script>
</head>
<body>
    <div class="p-6">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Conference Call</h2>
        <p class="text-gray-600 mb-6">Join the video conference by clicking on the menu. Please wait a moment for the call to connect.</p>
        <div class="conference-container rounded-lg shadow-xl">
            <div id="jaas-container"></div>
        </div>
    </div>
    
    <script>
        // The script now waits for the DOM to be fully loaded, which is more reliable
        // for dynamically injected content.
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[DEBUG] DOMContentLoaded event fired. Initializing Jitsi API.');

            // Use a simple polling loop to wait for the JitsiMeetExternalAPI to be available
            const checkJitsiApi = setInterval(() => {
                if (window.JitsiMeetExternalAPI) {
                    clearInterval(checkJitsiApi);
                    console.log('[DEBUG] JitsiMeetExternalAPI is available. Initializing...');
                    
                    const api = new JitsiMeetExternalAPI("8x8.vc", {
                        roomName: "vpaas-magic-cookie-9ba8c5498bf5496c95f1005fd25f4d51/SampleAppOperationalCoachesBillSelfishly",
                        parentNode: document.querySelector('#jaas-container'),
                        // Make sure to include a JWT if you intend to record,
                        // make outbound calls or use any other premium features!
                        // jwt: "null"
                    });
                    console.log('[DEBUG] Jitsi API initialized successfully.');
                }
            }, 500); // Check every 500ms
        });
    </script>
</body>
</html>
