<body class="bg-gray-100 min-h-screen p-8">
    <div class="container mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Manage Events</h1>

        <!-- Event List Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-700">All Events</h2>
                <button id="add-event-btn" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded-full shadow-md hover:bg-blue-600 transition-colors">
                    <i class="fas fa-plus mr-2"></i>Add New Event
                </button>
            </div>
            <div id="events-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Event cards will be dynamically added here -->
            </div>
        </div>

        <!-- Event Form Section -->
        <div id="event-form-container" class="hidden bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 id="form-title" class="text-2xl font-semibold text-gray-700 mb-4">Add Event</h2>
            <p id="event-message" class="text-sm font-medium mb-4 hidden"></p>
            <form id="event-form">
                <input type="hidden" id="event-doc-id">
                <div class="mb-4">
                    <label for="event-title" class="block text-gray-700 font-medium mb-2">Event Title</label>
                    <input type="text" id="event-title" name="event-title" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter event title" required>
                </div>
                <div class="mb-4">
                    <label for="event-date" class="block text-gray-700 font-medium mb-2">Event Date</label>
                    <input type="date" id="event-date" name="event-date" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="event-location" class="block text-gray-700 font-medium mb-2">Location</label>
                    <input type="text" id="event-location" name="event-location" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter location" required>
                </div>
                <div class="mb-4">
                    <label for="event-description" class="block text-gray-700 font-medium mb-2">Description</label>
                    <textarea id="event-description" name="event-description" rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter event description" required></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">Media Type</label>
                    <div class="flex items-center space-x-4">
                        <label class="inline-flex items-center">
                            <input type="radio" name="mediaType" value="image" class="form-radio text-blue-600" checked>
                            <span class="ml-2">Image</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="mediaType" value="video" class="form-radio text-blue-600">
                            <span class="ml-2">Video URL</span>
                        </label>
                    </div>
                </div>
                <div id="image-upload-container" class="mb-4">
                    <label for="media-file-input" class="block text-gray-700 font-medium mb-2">Upload Image</label>
                    <input type="file" id="media-file-input" name="media-file" accept="image/*" class="w-full">
                    <div id="image-preview" class="hidden mt-4">
                        <img src="" alt="Image Preview" class="w-full h-auto max-h-48 object-cover rounded-lg">
                    </div>
                </div>
                <div id="video-url-container" class="mb-4 hidden">
                    <label for="video-url-input" class="block text-gray-700 font-medium mb-2">Video URL</label>
                    <input type="url" id="video-url-input" name="video-url" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter video URL (e.g., YouTube)">
                </div>
                <div class="mb-4">
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="event-approved" name="event-approved" class="form-checkbox text-blue-600">
                        <span class="ml-2 text-gray-700 font-medium">Approved</span>
                    </label>
                </div>
                <div class="flex space-x-4">
                    <button type="submit" id="submit-event-btn" class="bg-blue-500 text-white font-semibold py-2 px-6 rounded-full shadow-md hover:bg-blue-600 transition-colors">Save Event</button>
                    <button type="button" id="cancel-event-btn" class="bg-gray-300 text-gray-800 font-semibold py-2 px-6 rounded-full shadow-md hover:bg-gray-400 transition-colors">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmation-modal" class="modal fixed inset-0 flex items-center justify-center hidden p-4">
        <div class="modal-content bg-white rounded-lg shadow-xl max-w-sm w-full p-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">Confirm Deletion</h3>
            <p class="text-gray-700 mb-6">Are you sure you want to delete this event? This action cannot be undone.</p>
            <div class="flex justify-end space-x-4">
                <button id="modal-cancel-btn" class="bg-gray-300 text-gray-800 font-semibold py-2 px-6 rounded-full hover:bg-gray-400 transition-colors">Cancel</button>
                <button id="modal-confirm-btn" class="bg-red-500 text-white font-semibold py-2 px-6 rounded-full hover:bg-red-600 transition-colors">Delete</button>
            </div>
        </div>
    </div>
</body>
