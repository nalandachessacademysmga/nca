<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nalanda Chess Academy - Wall of Fame</title>
    <!-- Use Tailwind CSS for a modern, responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom styles for the active nav link */
        nav.fixed.bottom-0 ul li a.active span,
        nav.fixed.bottom-0 ul li a.active i {
            color: #8b5cf6;
        }
        .wall-of-fame-card {
            flex: 0 0 auto; /* Added to make cards not grow and shrink */
            width: 300px; /* Fixed width for horizontal scrolling */
            transition: transform 0.3s ease-in-out;
        }
        .wall-of-fame-card:hover {
            transform: scale(1.05);
        }
        /* Custom scrollbar for horizontal scrolling (optional but good for UX) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-100 antialiased flex flex-col min-h-screen">

    <!-- Placeholder for the dynamically loaded header -->
    <div id="header-placeholder"></div>

    <!-- Main Content Area -->
    <main class="p-4 md:p-8 flex-grow pb-20 md:pb-8">

        <!-- Wall of Fame Section Title -->
        <section class="max-w-6xl mx-auto text-center py-8">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">WALL OF FAME</h1>
            <h3 class="text-xl text-gray-600 font-semibold">Celebrating Our Champions and Their Achievements</h3>
        </section>

        <div class="relative max-w-6xl mx-auto my-4">
            <div id="wall-of-fame-container" class="flex flex-nowrap gap-4 overflow-x-auto no-scrollbar py-2">
                </div>
            
            <button id="prev-btn" class="absolute top-1/2 -left-6 transform -translate-y-1/2 bg-gray-800 text-white p-2 rounded-full shadow-lg hover:bg-gray-700 focus:outline-none md:flex hidden">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button id="next-btn" class="absolute top-1/2 -right-6 transform -translate-y-1/2 bg-gray-800 text-white p-2 rounded-full shadow-lg hover:bg-gray-700 focus:outline-none md:flex hidden">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

    </main>

    <!-- Footer Section -->
    <footer class="bg-gray-900 text-gray-300 p-4 text-center mt-auto rounded-t-lg shadow-inner">
        <p>&copy; 2025 Nalanda Chess Academy. All rights reserved.</p>
    </footer>

    <!-- Script to load the header dynamically and handle page logic -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const headerPlaceholder = document.getElementById('header-placeholder');
            if (headerPlaceholder) {
                try {
                    const response = await fetch('header.html');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const headerHtml = await response.text();
                    headerPlaceholder.innerHTML = headerHtml;

                    // After header is loaded, initialize its UI elements
                    if (window.initializeHeaderUI) {
                        window.initializeHeaderUI();
                    }
                } catch (error) {
                    console.error('Error loading header:', error);
                }
            }
        });
    </script>

    <script src="wall-of-fame.js" type="module"></script>

</body>
</html>
