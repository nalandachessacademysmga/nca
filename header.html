<!-- This is the header file (header.html) which is dynamically loaded by the main page. -->
<!-- It contains both the desktop and mobile header layouts, managed by Tailwind CSS's responsive classes. -->
<!-- It also includes the navigation links and the authentication modal which are required by the main script. -->
<style>
    /* Add a media query to handle very small mobile screens */
    @media (max-width: 480px) {
        .bottom-nav-label {
            display: none;
        }
        .bottom-nav-icon {
            font-size: 1.5rem;
        }
        .bottom-nav-link {
            padding: 0.5rem;
        }
    }
</style>

<!-- Auth Modal (Hidden by default, shown on click) -->
<div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[1000] hidden">
    <div id="auth-modal-content" class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md scale-95 transform transition-all duration-300">
        <div class="flex justify-end">
            <button id="close-auth-modal" class="text-gray-500 hover:text-gray-900 dark:hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div class="text-center mb-6">
            <h3 class="text-3xl font-extrabold">Welcome!</h3>
            <p class="text-gray-500 dark:text-gray-400 mt-2">Login or Register to start playing.</p>
        </div>
        <form class="space-y-4">
            <div>
                <label for="email" class="sr-only">Email</label>
                <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-purple-500 focus:border-purple-500 dark:bg-gray-700 dark:text-white">
            </div>
            <div>
                <label for="password" class="sr-only">Password</label>
                <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-purple-500 focus:border-purple-500 dark:bg-gray-700 dark:text-white">
            </div>
            <div id="auth-message" class="text-center text-sm"></div>
            <div class="flex space-x-2">
                <button id="login-button" type="submit" class="w-1/2 bg-purple-600 text-white font-bold py-2 rounded-lg hover:bg-purple-700 transition duration-300">Login</button>
                <button id="register-button" type="button" class="w-1/2 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white font-bold py-2 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition duration-300">Register</button>
            </div>
        </form>
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-gray-400 dark:border-gray-500"></div>
            <span class="flex-shrink mx-4 text-gray-500 dark:text-gray-400">or</span>
            <div class="flex-grow border-t border-gray-400 dark:border-gray-500"></div>
        </div>
        <button id="google-login-button" class="w-full bg-red-600 text-white font-bold py-2 rounded-lg hover:bg-red-700 transition duration-300 flex items-center justify-center">
            <i class="fab fa-google mr-2"></i>Sign in with Google
        </button>
    </div>
</div>
